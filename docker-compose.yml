services:
  meali2picnic:
    build: .
    image: meali2picnic
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MEALIE_URL: ${MEALIE_URL:-}          # e.g. http://mealie:9000 or https://mealie.example.com
      MEALIE_TOKEN: ${MEALIE_TOKEN:-}      # Mealie -> user profile -> API Tokens
      NORISH_URL: ${NORISH_URL:-}        # or use Norish instead, e.g. http://norish:3000
      NORISH_TOKEN: ${NORISH_TOKEN:-}    # Norish -> Settings -> User -> API keys
      PICNIC_COUNTRY: ${PICNIC_COUNTRY:-DE}
      TRANSLATE_INGREDIENTS: ${TRANSLATE_INGREDIENTS:-en-de}   # off = search Picnic with the names as written
      AMAZON_DOMAIN: ${AMAZON_DOMAIN:-amazon.de}   # Amazon cart for pantry items; off to hide it
      AMAZON_ASSOCIATE_TAG: ${AMAZON_ASSOCIATE_TAG:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # optional: Claude translates unknown ingredient names
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}           # optional: or DeepL (the free key works)
      AUTO_TRANSLATE: ${AUTO_TRANSLATE:-auto}     # auto, claude, deepl or off
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}    # set this if the app is reachable beyond your own machine
    volumes:
      - ./data:/data                     # Picnic session token + remembered product choices
